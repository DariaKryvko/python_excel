[project]
name = "python-excel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dariya Kryvko", email = "krivko.dariya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "pyqt6>=6.12.0",
]

[project.scripts]
app = "python_excel:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/generated", ".venv"]
venvPath = "."
venv = ".venv"
reportIncompatibleMethodOverride = false

